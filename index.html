<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaleidoscope</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <aside class="controls">
        <h1>Kaleidoscope</h1>

        <section>
          <h2>Colors</h2>
          <div id="palette"></div>
          <h3>Background</h3>
          <div id="background"></div>
        </section>

        <section>
          <h2>Pattern</h2>
          <label>
            Slices
            <!-- Even counts only: each slice needs a mirrored partner, or a seam appears. -->
            <select id="slices">
              <option>6</option>
              <option selected>8</option>
              <option>10</option>
              <option>12</option>
            </select>
          </label>
          <label>
            Pieces <output id="pieces-value"></output>
            <input id="pieces" type="range" min="50" max="800" value="400" />
          </label>
          <label>
            Tube turns per loop
            <!-- Whole numbers only, or the loop jumps where it restarts. -->
            <select id="cell-turns">
              <option>0</option>
              <option selected>1</option>
              <option>2</option>
            </select>
          </label>
          <button id="new-pattern" type="button">New pattern</button>
        </section>

        <section>
          <h2>Loop</h2>
          <label>
            Length <output id="loop-seconds-value"></output>
            <input id="loop-seconds" type="range" min="2" max="30" value="6" />
          </label>
        </section>

        <section>
          <h2>Export GIF</h2>
          <label>
            Size
            <select id="gif-size">
              <option value="360">360 × 360</option>
              <option value="480" selected>480 × 480</option>
              <option value="720">720 × 720</option>
              <option value="1080">1080 × 1080</option>
            </select>
          </label>
          <label>
            Smoothness
            <select id="gif-fps">
              <option value="20">20 frames per second</option>
              <option value="25" selected>25 frames per second</option>
              <option value="50">50 frames per second</option>
            </select>
          </label>
          <p id="gif-summary" class="hint"></p>
          <div class="export-actions">
            <button id="export-gif" type="button">Export GIF</button>
            <button id="cancel-export" type="button" hidden>Cancel</button>
          </div>
          <progress id="export-progress" max="1" value="0" hidden></progress>
          <p id="export-status" class="hint" role="status"></p>
          <div id="export-result" class="export-result" hidden>
            <img id="export-image" alt="Exported GIF" />
            <a id="export-link">Download GIF</a>
          </div>
        </section>
      </aside>

      <section class="stage">
        <canvas id="preview"></canvas>
        <p id="stage-message" class="stage-message" role="alert" hidden></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
